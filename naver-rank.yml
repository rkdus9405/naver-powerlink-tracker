name: naver-powerlink-rank

on:
  schedule:
    # 매시간 정각(UTC 기준) 실행 = 1시간마다. GitHub Actions 예약은 부하에 따라 몇 분 지연될 수 있음.
    - cron: '0 * * * *'
  workflow_dispatch: {}   # 저장소 Actions 탭에서 수동 실행(Run workflow) 버튼용

permissions:
  contents: write         # 결과 CSV를 저장소에 커밋하기 위해 필요

concurrency:
  group: naver-rank
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run tracker
        run: python naver_powerlink_rank.py

      - name: Upload debug artifacts (보정용 HTML/스크린샷)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: |
            debug_page.html
            debug_screenshot.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit & push results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rankings.csv || true
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋 생략"
          else
            git commit -m "rank update $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git pull --rebase --autostash || true
            git push
          fi
